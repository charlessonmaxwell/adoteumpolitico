name: Publicar site

on:
  # Depois de cada atualização de dados (diária e semanal)
  workflow_run:
    workflows:
      [
        "Atualização diária de dados",
        "Presença da Câmara (semanal)",
        "Emendas parlamentares (quinzenal)",
      ]
    types: [completed]
  # Mudança no visual ou nos textos do site
  push:
    branches: [main]
    paths: ["site/**", "astro.config.mjs", "package.json", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: publicar-site
  cancel-in-progress: true # só a versão mais nova importa

env:
  PROJETO: adoteumpolitico

jobs:
  publicar:
    # Não publica se a atualização de dados falhou (o site anterior continua no ar)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile

      - name: Baixar só o que o site usa da branch data
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse --branch data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
          cd dados
          git sparse-checkout set --no-cone '/resumo/' '/votos/' '/projetos/' '/medias.json' '/panorama.json' '/emendas/' '/meta.json' '/parlamentares.json'
          echo "Perfis: $(ls resumo | wc -l)"

      - name: Criar o projeto na Cloudflare (só na primeira vez)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN não cadastrado" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          # Diagnóstico seguro: mostra só se o token é válido, nunca o valor
          V=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')
          echo "::notice::Token: $V"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            # Sem o secret: descobre a conta pelo próprio token (o ID não é sigiloso, mas fica mascarado)
            CLOUDFLARE_ACCOUNT_ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
            [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Não foi possível descobrir a conta pelo token. Cadastre o secret CLOUDFLARE_ACCOUNT_ID."; exit 1; }
            echo "::notice::Account ID descoberto pelo token"
          fi
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          pnpm dlx wrangler@4 pages project create "$PROJETO" --production-branch main > criar.log 2>&1 || true
          echo "::notice::Criar projeto: $(grep -iE 'success|already|exist|error|✘' criar.log | head -3 | tr '\n' ' ')"

      - name: Descobrir o endereço do site
        id: endereco
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          R=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJETO")
          SUB=$(echo "$R" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            echo "::error::Erro ao ler o projeto: $(echo "$R" | jq -c '[.errors[]? | {code, message}]')"
            exit 1
          fi
          echo "url=https://$SUB" >> "$GITHUB_OUTPUT"
          echo "::notice::Endereço do site: https://$SUB"
          echo "Endereço: https://$SUB"

      - name: Contagem de visitas (Cloudflare Web Analytics, sem cookie)
        id: analytics
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID }}
          URL_SITE: ${{ steps.endereco.outputs.url }}
        run: |
          HOST=${URL_SITE#https://}
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info
          L=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/list?per_page=50")
          T=$(echo "$L" | jq -r --arg h "$HOST" '[.result[]? | select(.ruleset.zone_name == $h or .host == $h)][0].site_token // empty')
          if [ -z "$T" ]; then
            C=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$API" -d "{\"host\":\"$HOST\",\"auto_install\":false}")
            T=$(echo "$C" | jq -r '.result.site_token // empty')
            [ -z "$T" ] && echo "::warning::Web Analytics não ativado pelo token (falta permissão 'Account Analytics: Edit'?): $(echo "$C" | jq -c '[.errors[]?.message]')"
          fi
          [ -n "$T" ] && echo "::notice::Web Analytics ativo para $HOST" && echo "beacon=$T" >> "$GITHUB_OUTPUT"

      - name: Gerar o site
        env:
          DADOS_DIR: dados
          SITE_URL: ${{ steps.endereco.outputs.url }}
          PUBLIC_CF_BEACON: ${{ steps.analytics.outputs.beacon }}
        run: pnpm site:build

      - name: Conferir neutralidade dos textos
        run: node scripts/verificar-neutralidade.mjs site/dist dados/parlamentares.json

      - name: Segredo do formulário "Achou um erro?" (se cadastrado)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID }}
          ERROS_GITHUB_TOKEN: ${{ secrets.ERROS_GITHUB_TOKEN }}
        run: |
          if [ -z "$ERROS_GITHUB_TOKEN" ]; then echo "::notice::Formulário de erros sem token: o site mostra o link do GitHub como alternativa."; exit 0; fi
          printf '%s' "$ERROS_GITHUB_TOKEN" | pnpm dlx wrangler@4 pages secret put ERROS_GITHUB_TOKEN --project-name "$PROJETO" > segredo.log 2>&1 && echo "::notice::Formulário de erros ativo" || echo "::warning::Não foi possível gravar o segredo do formulário: $(grep -iE 'error|✘' segredo.log | head -2 | tr '\n' ' ')"

      - name: Publicar na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy site/dist --project-name "$PROJETO" --branch main --commit-dirty=true

      - name: Resumo
        run: |
          echo "### Site no ar: ${{ steps.endereco.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar métricas ao Grafana
        if: always()
        continue-on-error: true
        env:
          GRAFANA_INFLUX_URL: ${{ secrets.GRAFANA_INFLUX_URL }}
          GRAFANA_USUARIO: ${{ secrets.GRAFANA_USUARIO }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          ok=$([ "${{ job.status }}" = "success" ] && echo sucesso || echo falha)
          paginas=$(find site/dist -name '*.html' 2>/dev/null | wc -l)
          echo "{\"workflow\":\"publicar\",\"resultado\":\"$ok\",\"duracaoTotalS\":$(( $(date +%s) - INICIO )),\"etapasS\":{},\"contagens\":{\"paginas\":$paginas},\"travaDisparou\":false,\"mudou\":null}" > metricas.json
          node scripts/enviar-metricas.mjs metricas.json

      - name: Abrir issue de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/abrir-issue-falha.sh "Falha ao publicar o site"
