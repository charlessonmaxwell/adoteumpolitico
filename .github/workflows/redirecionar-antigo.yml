name: Redirecionar endereço antigo
# Uso único (manual): publica no projeto antigo só um redirecionamento 301 para o site novo.
on: workflow_dispatch
jobs:
  redirecionar:
    runs-on: ubuntu-latest
    steps:
      - name: Montar redirecionamento
        run: |
          mkdir -p r
          echo '/* https://adoteumpolitico.pages.dev/:splat 301' > r/_redirects
          echo '<meta http-equiv="refresh" content="0;url=https://adoteumpolitico.pages.dev/">' > r/index.html
      - name: Publicar no projeto antigo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 pages deploy r --project-name meupoliticodeestimacao --branch main --commit-dirty=true
