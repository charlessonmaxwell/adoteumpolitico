name: Visitas do site (diário)
# Story 2.5: leva as visitas de ontem do Cloudflare Web Analytics ao Grafana. Nunca falha.
on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visitas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar e enviar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRAFANA_INFLUX_URL: ${{ secrets.GRAFANA_INFLUX_URL }}
          GRAFANA_USUARIO: ${{ secrets.GRAFANA_USUARIO }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: node scripts/coletar-visitas.mjs
