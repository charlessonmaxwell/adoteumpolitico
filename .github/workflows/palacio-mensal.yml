name: Cartão do Palácio (mensal)
# Story 7.1. O Portal publica o cartão corporativo uma vez por mês; a rotina baixa só os meses
# que faltam e revisa os 3 últimos.
# Story 7.2: dados desde 2018, um JSON por ano. Cada execução baixa por até 20 min, publica o que
# tem e, se ainda faltar ano e esta execução trouxe algo novo, dispara a próxima sozinha.

on:
  schedule:
    - cron: "37 14 3,18 * *" # dias 3 e 18, 11:37 em Brasília (pega o mês novo e revisões)
  workflow_dispatch:
    inputs:
      ignorar_trava:
        description: "Publicar mesmo com unidade nova ou queda (só depois de revisar config/palacio.json)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write # disparar a próxima execução enquanto a carga não termina (story 7.2)

concurrency:
  group: dados # mesmo grupo das outras rotinas: nunca publicam ao mesmo tempo
  cancel-in-progress: false

jobs:
  palacio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Baixar a última publicação (branch data)
        run: |
          git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" publicado
          rm -rf publicado/.git

      - name: Coletar e somar o cartão corporativo
        env:
          IGNORAR_TRAVA: ${{ github.event.inputs.ignorar_trava == 'true' }}
        run: |
          set -o pipefail
          pnpm rotina:palacio publicado | tee palacio.log
          echo "::notice::$(tail -1 palacio.log)"

      - name: Publicar na branch data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publicar-dados.sh publicado "Cartão do Palácio de $(date -u +%F)"

      - name: Continuar a carga (ainda faltam anos)
        if: hashFiles('palacio-continuar') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::Ainda faltam: $(cat palacio-continuar). Disparando a próxima execução."
          gh workflow run palacio-mensal.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"

      - name: Enviar métricas ao Grafana
        if: always()
        continue-on-error: true
        env:
          GRAFANA_INFLUX_URL: ${{ secrets.GRAFANA_INFLUX_URL }}
          GRAFANA_USUARIO: ${{ secrets.GRAFANA_USUARIO }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: node scripts/enviar-metricas.mjs metricas.json

      - name: Abrir issue de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/abrir-issue-falha.sh "Falha na rotina mensal do cartão do Palácio"
